<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Turbo Crawler</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        .speed-badge {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .turbo-banner {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(16, 185, 129, 0.1));
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .turbo-text h4 {
            font-size: 12px;
            color: #00f0ff;
            margin-bottom: 2px;
        }
        .turbo-text p {
            font-size: 10px;
            color: #94a3b8;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-subtle {
            background: #111726;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-subtle:hover {
            background: #161f33;
            color: #f8fafc;
            border-color: rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Top HUD Header -->
    <header class="hud-header">
        <div class="brand">
            <img src="icons/icon48.png" alt="Crawler Logo" class="brand-logo">
            <div class="brand-text">
                <h1>GMAIL CRAWLER</h1>
                <span class="version-badge">v2.2 TURBO</span>
            </div>
        </div>
        <div class="target-beacon" id="target-beacon">
            <span class="beacon-dot"></span>
            <span class="beacon-label" id="beacon-text">SCANNING...</span>
        </div>
    </header>

    <!-- Turbo Banner -->
    <div class="turbo-banner">
        <div class="turbo-text">
            <h4>⚡ TURBO ENGINE ACTIVE</h4>
            <p>Micro-second polling &bull; Scrapes ~100+ emails/sec</p>
        </div>
        <span class="speed-badge">20x SPEED</span>
    </div>

    <!-- Telemetry Stats Cards -->
    <section class="telemetry-grid">
        <div class="telemetry-card">
            <span class="telemetry-label">INBOX ROWS</span>
            <div class="telemetry-value" id="stat-emails">--</div>
            <span class="telemetry-sub">on active screen</span>
        </div>
        <div class="telemetry-card">
            <span class="telemetry-label">SECTION</span>
            <div class="telemetry-value text-cyan" id="stat-folder">ALL</div>
            <span class="telemetry-sub">Inbox/Spam/All</span>
        </div>
        <div class="telemetry-card">
            <span class="telemetry-label">ENGINE</span>
            <div class="telemetry-value text-emerald" id="stat-status">READY</div>
            <span class="telemetry-sub">Non-Blocking</span>
        </div>
    </section>

    <!-- Scope Configuration -->
    <section class="config-panel">
        <div class="section-title">
            <span>CRAWL SCOPE</span>
            <span class="mode-tag">ALL PAGES</span>
        </div>

        <div class="slider-header" style="margin-bottom: 6px;">
            <span>MAX PAGES TO CRAWL</span>
            <span class="slider-value" id="depth-val">All Pages (Until End)</span>
        </div>
        <select class="cyber-slider" id="page-limit-select" style="background:#0a0d14; color:#00f0ff; border:1px solid rgba(0,240,255,0.3); padding:6px; border-radius:4px; width:100%; font-family:monospace; font-size:11px; outline:none; cursor:pointer;">
            <option value="999" selected>All Available Pages (Entire Section)</option>
            <option value="50">50 Pages (~2,500 Emails)</option>
            <option value="25">25 Pages (~1,250 Emails)</option>
            <option value="10">10 Pages (~500 Emails)</option>
            <option value="5">5 Pages (~250 Emails)</option>
        </select>
    </section>

    <!-- Export Format Bar -->
    <section class="export-format-bar">
        <span class="format-label">FORMAT:</span>
        <div class="format-chips">
            <label class="format-chip active">
                <input type="radio" name="format" value="csv" checked>
                <span>CSV (Excel)</span>
            </label>
            <label class="format-chip">
                <input type="radio" name="format" value="json">
                <span>JSON</span>
            </label>
        </div>
        <div class="schema-pill">5 Attributes</div>
    </section>

    <!-- Action Buttons -->
    <footer class="action-footer">
        <div class="btn-stack">
            <button class="cyber-btn primary" id="btn-crawl-turbo">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">START TURBO CRAWL (ALL PAGES)</span>
            </button>
            <button class="btn-subtle" id="btn-crawl-page">
                <span>📥</span>
                <span>Extract Current Screen Only (50)</span>
            </button>
        </div>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
