<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Bulk Crawler</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        .mode-selection-box {
            background: #111726;
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .mode-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            border: 1px solid transparent;
        }
        .mode-option:last-child {
            margin-bottom: 0;
        }
        .mode-option:hover {
            background: rgba(0, 240, 255, 0.05);
        }
        .mode-option.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: #00f0ff;
        }
        .mode-option input[type="radio"] {
            margin-top: 3px;
            accent-color: #00f0ff;
            cursor: pointer;
        }
        .mode-info h4 {
            font-size: 12px;
            color: #f8fafc;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-info p {
            font-size: 10px;
            color: #94a3b8;
            line-height: 1.3;
        }
        .badge-rec {
            font-size: 9px;
            background: #10b981;
            color: #000;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .page-limit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: #94a3b8;
        }
        .page-limit-select {
            background: #0a0d14;
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Top HUD Header -->
    <header class="hud-header">
        <div class="brand">
            <img src="icons/icon48.png" alt="Crawler Logo" class="brand-logo">
            <div class="brand-text">
                <h1>GMAIL CRAWLER PRO</h1>
                <span class="version-badge">v2.1 BULK</span>
            </div>
        </div>
        <div class="target-beacon" id="target-beacon">
            <span class="beacon-dot"></span>
            <span class="beacon-label" id="beacon-text">SCANNING...</span>
        </div>
    </header>

    <!-- Telemetry Stats Cards -->
    <section class="telemetry-grid">
        <div class="telemetry-card">
            <span class="telemetry-label">INBOX ROWS</span>
            <div class="telemetry-value" id="stat-emails">--</div>
            <span class="telemetry-sub" id="stat-emails-sub">on current page</span>
        </div>
        <div class="telemetry-card">
            <span class="telemetry-label">SECTION</span>
            <div class="telemetry-value text-cyan" id="stat-folder">ALL</div>
            <span class="telemetry-sub">Inbox/Spam/All</span>
        </div>
        <div class="telemetry-card">
            <span class="telemetry-label">STATUS</span>
            <div class="telemetry-value text-emerald" id="stat-status">READY</div>
            <span class="telemetry-sub">Multi-Page Ready</span>
        </div>
    </section>

    <!-- Crawl Mode Selector -->
    <section class="mode-selection-box">
        <label class="mode-option active" id="opt-bulk">
            <input type="radio" name="crawl_scope" value="bulk" checked>
            <div class="mode-info">
                <h4>🌐 CRAWL ALL PAGES <span class="badge-rec">RECOMMENDED</span></h4>
                <p>Auto-flips through pages 1, 2, 3... to extract <strong>ALL emails</strong> into a single combined CSV.</p>
            </div>
        </label>

        <label class="mode-option" id="opt-page">
            <input type="radio" name="crawl_scope" value="page">
            <div class="mode-info">
                <h4>⚡ Single Page Only</h4>
                <p>Extract only the 50 emails currently visible on this single screen.</p>
            </div>
        </label>

        <div class="page-limit-row" id="limit-row">
            <span>Crawl Depth:</span>
            <select class="page-limit-select" id="page-limit-select">
                <option value="999" selected>All Available Pages (Until End)</option>
                <option value="50">50 Pages (~2,500 Emails)</option>
                <option value="20">20 Pages (~1,000 Emails)</option>
                <option value="10">10 Pages (~500 Emails)</option>
                <option value="5">5 Pages (~250 Emails)</option>
            </select>
        </div>
    </section>

    <!-- Terminal Log Stream -->
    <section class="terminal-panel">
        <div class="terminal-header">
            <div class="terminal-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="terminal-title">CRAWLER TELEMETRY</span>
            <button class="terminal-clear" id="btn-clear-log">CLEAR</button>
        </div>
        <div class="terminal-body" id="terminal-log">
            <div class="log-line"><span class="log-ts">[INIT]</span> Multi-page crawler engine ready.</div>
            <div class="log-line text-cyan"><span class="log-ts">[TARGET]</span> Select 'All Pages' to scrape entire mailbox.</div>
        </div>
    </section>

    <!-- Export Format Bar -->
    <section class="export-format-bar">
        <span class="format-label">FORMAT:</span>
        <div class="format-chips">
            <label class="format-chip active">
                <input type="radio" name="format" value="csv" checked>
                <span>CSV (Excel)</span>
            </label>
            <label class="format-chip">
                <input type="radio" name="format" value="json">
                <span>JSON</span>
            </label>
        </div>
        <div class="schema-pill">5 Attributes</div>
    </section>

    <!-- Action Button -->
    <footer class="action-footer">
        <button class="cyber-btn primary" id="btn-crawl-start">
            <span class="btn-glow"></span>
            <span class="btn-icon">▶</span>
            <span class="btn-text" id="crawl-btn-text">START MULTI-PAGE CRAWL</span>
        </button>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
